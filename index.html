<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    const ua = navigator.userAgent.toLowerCase();
    if (/iphone|ipad|ipod/.test(ua)) {
      window.location = 'https://apps.apple.com/tr/app/apartix/id6764777358';
    } else if (/android/.test(ua)) {
      window.location = 'https://play.google.com/store/apps/details?id=com.apartix.app';
    }
  </script>
</head>
<body></body>
</html>
